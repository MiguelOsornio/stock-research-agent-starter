# Setup attendee Blueprint names
#
# Manual workflow (Actions → Run workflow). Edits render.yaml so the project
# becomes {username}-renderatl-workshop, then commits to the fork.
# Does not deploy: use Render Dashboard → New → Blueprint (or the CLI) after.

name: Setup attendee Blueprint names

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    name: Namespace Render Blueprints
    runs-on: ubuntu-latest

    steps:
      # Never rewrite names on the upstream starter's main branch.
      - name: Refuse upstream main
        if: ${{ github.repository == 'ojusave/stock-research-agent-starter' && github.ref_name == 'main' }}
        run: |
          echo "This setup workflow is for attendee forks."
          echo "Refusing to namespace Blueprints on ${GITHUB_REPOSITORY} main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses GITHUB_ACTOR as the namespace.
      - name: Namespace Blueprint resources
        run: npm run setup

      - name: Commit namespaced Blueprint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add render.yaml

          if git diff --cached --quiet; then
            echo "Blueprints are already namespaced for ${GITHUB_ACTOR}."
            exit 0
          fi

          git commit -m "Namespace Render resources for ${GITHUB_ACTOR} (${GITHUB_ACTOR}-renderatl-workshop)"
          git push
