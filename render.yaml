# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Blueprint for the request-bound web service only.
# Create the Workflow service later in the Dashboard.

# If this name is taken in a shared workspace, change it before deploy
# (for example stock-research-web-<github-username>).
services:
  - type: web
    name: stock-research-agent-starter
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RESEARCH_DELAY_MS
        value: "4000"
      - key: MODEL_BASE_URL
        value: "https://api.openai.com/v1"
      - key: MODEL_NAME
        value: "gpt-4o-mini"
      - key: RENDER_API_KEY
        sync: false
      - key: WORKFLOW_SERVICE_SLUG
        sync: false
