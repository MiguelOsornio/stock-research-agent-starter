# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Stock research starter web service.
# After forking, run the Setup attendee Blueprint names Action (or
# `npm run setup -- your-github-username`) so the Render project becomes
# `{username}-renderatl-workshop`. Then deploy from the Dashboard or CLI.

projects:
  - name: renderatl-workshop
    environments:
      - name: production
        services:
          - type: web
            name: stock-research-agent-starter
            runtime: node
            plan: starter
            buildCommand: npm install
            startCommand: npm start
            healthCheckPath: /healthz
            envVars:
              - key: NODE_VERSION
                value: "20"
              - key: RESEARCH_DELAY_MS
                value: "8000"
